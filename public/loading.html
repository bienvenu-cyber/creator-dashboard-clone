<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .loader-container {
            text-align: center;
        }

        /* OnlyFans-style logo animation */
        .of-logo {
            width: 100px;
            height: 100px;
            position: relative;
            margin: 0 auto 32px;
        }

        .of-logo svg {
            width: 100%;
            height: 100%;
        }

        .of-logo-circle {
            fill: #00AFF0;
        }

        .of-logo-ring {
            fill: none;
            stroke: #fff;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 120;
            stroke-dashoffset: 120;
            animation: ring-draw 1.5s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes ring-draw {
            0% {
                stroke-dashoffset: 120;
                transform: rotate(0deg);
            }
            50% {
                stroke-dashoffset: 0;
            }
            100% {
                stroke-dashoffset: -120;
                transform: rotate(360deg);
            }
        }

        /* Loading dots */
        .loading-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .loading-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #00AFF0;
            animation: pulse-dot 1.4s ease-in-out infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse-dot {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Loading text */
        .loading-text {
            color: #666;
            font-size: 14px;
            margin-top: 20px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="of-logo">
            <svg viewBox="0 0 100 100">
                <circle class="of-logo-circle" cx="50" cy="50" r="45"/>
                <path class="of-logo-ring" d="M50 15 A35 35 0 1 1 50 85 A35 35 0 1 1 50 15"/>
            </svg>
        </div>
        <div class="loading-dots">
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
            <div class="loading-dot"></div>
        </div>
        <div class="loading-text">Loading...</div>
    </div>
</body>
</html>
